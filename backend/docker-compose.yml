services:
  postgres:
    image: postgres:17
    container_name: cybersecurity-postgres
    restart: unless-stopped

    # Credentials come from backend/.env (not committed), the same values
    # the backend uses, so they can't drift apart.
    # Note: POSTGRES_PASSWORD only applies when the volume is first created.
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}

    # Only reachable from this machine, not from the LAN
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Learn-path progress (XP, levels, stars, topic stages)
  mongo:
    image: mongo:7
    container_name: cybersecurity-mongo
    restart: unless-stopped

    # Root account for administration; the backend uses the app user,
    # which docker/mongo-init creates with readWrite on MONGO_DB only.
    # Like Postgres, these only apply when the volume is first created.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:?set MONGO_DB in .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}

    # Only reachable from this machine, not from the LAN
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
